name: Deploy SciManager to GitHub Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Inject Supabase Config (Python) 🐍
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 -c "
          import os, json
          url = os.environ.get('SUPABASE_URL', '').strip().strip('\"').strip(\"'\")
          key = os.environ.get('SUPABASE_ANON_KEY', '').strip().strip('\"').strip(\"'\")
          if url and key and os.path.exists('js/supabaseClient.template.js'):
              with open('js/supabaseClient.template.js', 'r', encoding='utf-8') as f: content = f.read()
              content = content.replace('\"%%SUPABASE_URL%%\"', json.dumps(url))
              content = content.replace('\"%%SUPABASE_ANON_KEY%%\"', json.dumps(key))
              with open('js/supabaseClient.js', 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Supabase config successfully injected from Secrets')
          "

      - name: Prepare Deployment Folder 📦
        run: |
          mkdir deploy_dist
          rsync -av --progress --exclude='.github' --exclude='supabase' --exclude='deploy_dist' . deploy_dist/
          rm -f deploy_dist/.gitignore

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4

      - name: Upload Artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_dist'

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
